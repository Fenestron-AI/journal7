services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: journal7-db
    environment:
      POSTGRES_DB: journal7
      POSTGRES_USER: journal7
      POSTGRES_PASSWORD: journal7_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U journal7"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: journal7-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: journal7-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # AI worker: FastAPI (sync/ingest/QA) + pix2text OCR + LibreOffice + poppler
  # in one container. pix2text listens on 8001 (localhost inside container).
  worker:
    build:
      context: ./ai-worker
      args:
        P2T_DEVICE: cpu
    container_name: journal7-worker
    env_file:
      - ./ai-worker/.env
    environment:
      DATABASE_URL: postgresql://journal7:journal7_dev@postgres:5432/journal7
      FORMULA_OCR_URL: http://localhost:8001
      WATCH_DIR: /app/data/legal-docs
      P2T_DEVICE: cpu
    ports:
      - "8000:8000"
    volumes:
      - ./data/legal-docs:/app/data/legal-docs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 60s

  # Same image but with onnxruntime-gpu; requires nvidia-container-toolkit.
  # Enable: docker compose --profile gpu up -d worker-gpu
  worker-gpu:
    profiles: [gpu]
    build:
      context: ./ai-worker
      args:
        P2T_DEVICE: gpu
    container_name: journal7-worker-gpu
    env_file:
      - ./ai-worker/.env
    environment:
      DATABASE_URL: postgresql://journal7:journal7_dev@postgres:5432/journal7
      FORMULA_OCR_URL: http://localhost:8001
      WATCH_DIR: /app/data/legal-docs
      P2T_DEVICE: gpu
    ports:
      - "8000:8000"
    volumes:
      - ./data/legal-docs:/app/data/legal-docs
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  pgdata:
  redisdata:
  miniodata:

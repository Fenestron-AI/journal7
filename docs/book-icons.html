  const svgFixed = v.svg.replace(/id="g(\w+)"/g, (_,n) => `id="${uId}${n}"`).replace(/url\(#g(\w+)\)/g, (_,n) => `url(#${uId}${n})`);
  card.innerHTML = `<span class="n">${v.id}</span><div class="btn">${svgFixed}</div><span class="name">${v.name}</span>`;
  grid.appendChild(card);
});
</script>
</body>
</html>

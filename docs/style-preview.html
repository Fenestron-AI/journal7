  h1 { font-size: 24px; font-weight: 600; margin-bottom: 32px; color: rgba(0,0,0,0.85); }

  .row {
    display: flex; align-items: center;

  }
  .row:hover { background: #fafafa; margin: 0 -12px; padding-left: 12px; padding-right: 12px; border-radius: 4px; }
  .row .title {
    font-size: 16px; font-weight: 600; line-height: 24px; color: rgba(0,0,0,0.85);
    display: flex; align-items: center; gap: 8px;
    flex: 1;
  }
  .row .title .n { font-size: 11px; font-weight: 400; color: #bfbfbf; min-width: 24px; }
  .row .btn {
    width: 28px; height: 28px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0; cursor: pointer; transition: transform .12s;
  }
  .row .btn:hover { transform: scale(1.12); }
  .row .tag { font-size: 10px; color: #999; white-space: nowrap; min-width: 56px; text-align: right; margin-left: auto; }
  svg.icon { width: 16px; height: 16px; }
</style>

  { bg:"transparent", c:"#1677ff", b:"#91caff", s:"0 0 0 2px #1677ff10", r:14, tag:"Круг в кольце" },
];

const list = document.getElementById('list');
styles.forEach((s, i) => {
  const row = document.createElement('div');
  row.className = 'row';

  const bw = s.bw || 1;
  const br = s.r || 6;
  const shadow = s.s || 'none';
  const bgColor = s.bg || 'transparent';
  const bdColor = s.b || 'transparent';
  const isGrad = typeof bgColor === 'string' && (bgColor.startsWith('linear') || bgColor.startsWith('radial'));

  const btnStyle = [
    `color:${s.c}`,
    `background:${isGrad ? bgColor : bgColor}`,
    `border:${bw}px solid ${bdColor}`,
    `box-shadow:${shadow}`,
    `border-radius:${br}px`,
    'width:28px;height:28px',
  ].join(';');

const iconIdx = i % icons.length;
  row.innerHTML = `
    <div class="title"><span class="n">${i+1}</span> Нормативно-правовая база
      <div class="btn" style="${btnStyle}">${icons[iconIdx]}</div>
      <span class="tag">${iconNames[iconIdx]} · ${s.tag}</span>
    </div>
  `;
  list.appendChild(row);
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Значок обучения — варианты</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #fff; padding: 40px 48px; color: rgba(0,0,0,0.85); }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  .sub { font-size: 13px; color: #999; margin-bottom: 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px; max-width: 1300px; }
  .card { display: flex; align-items: center; padding: 8px 10px; gap: 12px; border-radius: 6px; }
  .card:hover { background: #fafafa; }
  .n { font-size: 10px; color: #bbb; min-width: 18px; }
  .name { font-size: 12px; color: rgba(0,0,0,0.85); flex: 1; }
  .btn { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #262626; border-radius: 4px; }
  svg { width: 15px; height: 15px; }
  hr { grid-column: 1/-1; border: none; border-top: 1px dashed #e8e8e8; margin: 4px 0; }
  .cat { grid-column: 1/-1; font-size: 11px; font-weight: 700; color: #999; text-transform: uppercase; letter-spacing: 1px; margin-top: 8px; }
</style>
</head>
<body>

<h1>Значок «Обучить AI-агента»</h1>
<div class="sub">в том же размере, что на странице НБП (15px, строка таблицы)</div>

<div class="grid" id="grid"></div>

<script>
const capBase = (fill, inner) => `
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${inner || 1.8}" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 10L12 5 2 10l10 5 10-5z" ${fill}/>
    <path d="M6 12v5c0 2 3 3.5 6 2 3 1.5 6 0 6-2v-5"/>
    <line x1="12" y1="15" x2="12" y2="18"/>
  </svg>`;

const variants = [];
let id = 0;
const push = (svg, name) => variants.push({ id: ++id, svg, name });

// === СЕКЦИЯ 1: Контуры, толщина ===
push(`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 2 3 3.5 6 2 3 1.5 6 0 6-2v-5"/><line x1="12" y1="15" x2="12" y2="18"/></svg>`, 'Тонкий 1px');
push(`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 2 3 3.5 6 2 3 1.5 6 0 6-2v-5"/><line x1="12" y1="15" x2="12" y2="18"/></svg>`, 'Средний 1.5px');
push(`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 2 3 3.5 6 2 3 1.5 6 0 6-2v-5"/><line x1="12" y1="15" x2="12" y2="18"/></svg>`, 'Жирный 2px');
push(`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 2 3 3.5 6 2 3 1.5 6 0 6-2v-5"/><line x1="12" y1="15" x2="12" y2="18"/></svg>`, 'Очень жирный 2.5px');
push(`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 2 3 3.5 6 2 3 1.5 6 0 6-2v-5"/></svg>`, 'Без кисточки');
push(`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 2 3 3.5 6 2 3 1.5 6 0 6-2v-5"/><line x1="12" y1="15" x2="12" y2="18"/><circle cx="12" cy="19" r="0.7" fill="currentColor"/></svg>`, 'С шариком на кисточке');
push(`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 2 3 3.5 6 2 3 1.5 6 0 6-2v-5"/><line x1="12" y1="15" x2="12" y2="19" stroke-dasharray="1 1"/></svg>`, 'Пунктирная кисточка');

// === СЕКЦИЯ 2: Заливка ===
push(`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z" fill="currentColor" fill-opacity="0.12"/><path d="M6 12v5c0 2 3 3.5 6 2 3 1.5 6 0 6-2v-5"/><line x1="12" y1="15" x2="12" y2="18"/></svg>`, 'Заливка 12%');
push(`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z" fill="currentColor" fill-opacity="0.25"/><path d="M6 12v5c0 2 3 3.5 6 2 3 1.5 6 0 6-2v-5"/><line x1="12" y1="15" x2="12" y2="18"/></svg>`, 'Заливка 25%');
push(`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z" fill="currentColor" fill-opacity="0.4"/><path d="M6 12v5c0 2 3 3.5 6 2 3 1.5 6 0 6-2v-5"/><line x1="12" y1="15" x2="12" y2="18"/></svg>`, 'Заливка 40%');
push(`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z" fill="currentColor"/><path d="M6 12v5c0 2 3 3.5 6 2 3 1.5 6 0 6-2v-5"/></svg>`, 'Сплошная');
push(`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z" fill="currentColor" fill-opacity="0.12"/><path d="M6 12v5c0 2 3 3.5 6 2 3 1.5 6 0 6-2v-5"/><line x1="12" y1="15" x2="12" y2="18"/><line x1="8" y1="10" x2="16" y2="10" stroke-dasharray="2 2"/></svg>`, 'Заливка + линии');

// === СЕКЦИЯ 3: Кисточка влево/вправо ===
push(`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 2 3 3.5 6 2 3 1.5 6 0 6-2v-5"/><path d="M17 15c.5 2-1.5 3-3 4"/></svg>`, 'Кисточка вправо');
push(`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 2 3 3.5 6 2 3 1.5 6 0 6-2v-5"/><path d="M7 15c-.5 2 1.5 3 3 4"/></svg>`, 'Кисточка влево');
push(`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 2 3 3.5 6 2 3 1.5 6 0 6-2v-5"/><path d="M12 15v4"/><circle cx="12" cy="20" r="1"/></svg>`, 'Кисточка с узлом');

// === СЕКЦИЯ 4: Геометрия ===
push(`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 10L12 5l10 5-10 5-10-5z"/><path d="M5 12.5V17c0 2.5 3.5 4 7 2 3.5 2 7 .5 7-2v-4.5"/><line x1="12" y1="15" x2="12" y2="18"/></svg>`, 'Плоский верх (классика)');
push(`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 11L12 4l10 7-10 7-10-7z"/><path d="M5 13v5c0 3 4 4 7 1 3 3 7 2 7-1v-5"/><line x1="12" y1="18" x2="12" y2="20"/></svg>`, 'Купол');
push(`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10c3-2 6-4 9-4s6 2 9 4c-3 2-6 4-9 4s-6-2-9-4z"/><path d="M5 12v4c0 2 3 3 7 3s7-1 7-3v-4"/><line x1="12" y1="16" x2="12" y2="19"/></svg>`, 'Узкий');
push(`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 10L12 4l11 6-11 6-11-6z"/><path d="M4 12v5c0 2.5 4 4 8 1 4 3 8 1.5 8-1v-5"/><line x1="12" y1="16" x2="12" y2="20"/></svg>`, 'Широкий');
push(`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8l8 5 8-5-8-5-8 5z"/><path d="M4 8v6c0 2 3 3.5 8 2 5 1.5 8 0 8-2V8"/><line x1="12" y1="13" x2="12" y2="16"/></svg>`, 'Острый');
push(`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l8-6 8 6-8 6-8-6z"/><path d="M6 14v4c0 2 2 3.5 6 2 4 1.5 6 0 6-2v-4"/><line x1="12" y1="18" x2="12" y2="21"/></svg>`, 'Округлый');

// === СЕКЦИЯ 5: С декором ===
push(`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 2 3 3.5 6 2 3 1.5 6 0 6-2v-5"/><line x1="12" y1="15" x2="12" y2="18"/><polygon points="17,3 17.6,1.5 19,1 17.6,0.5 17,-1 16.4,0.5 15,1 16.4,1.5" fill="currentColor"/></svg>`, 'Со звездой');
push(`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z" fill="currentColor" fill-opacity="0.12"/><path d="M6 12v5c0 2 3 3.5 6 2 3 1.5 6 0 6-2v-5"/><line x1="12" y1="15" x2="12" y2="18"/><polygon points="21,3 21.7,4.6 23.5,4.8 22.2,6 22.5,7.8 21,7 19.5,7.8 19.8,6 18.5,4.8 20.3,4.6" fill="currentColor"/></svg>`, 'Со звездой + заливка');
push(`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 2 3 3.5 6 2 3 1.5 6 0 6-2v-5"/><line x1="12" y1="15" x2="12" y2="18"/><line x1="8" y1="3" x2="8" y2="6"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="16" y1="3" x2="16" y2="6"/></svg>`, 'С искрами');
push(`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 2 3 3.5 6 2 3 1.5 6 0 6-2v-5"/><line x1="12" y1="15" x2="12" y2="18"/><path d="M10 7l1.5-2 1.5 2-1.5 2z" fill="currentColor"/></svg>`, 'С ромбиком');
push(`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 2 3 3.5 6 2 3 1.5 6 0 6-2v-5"/><line x1="12" y1="15" x2="12" y2="18"/><line x1="12" y1="5" x2="12" y2="1"/><line x1="7" y1="6" x2="5" y2="3"/><line x1="17" y1="6" x2="19" y2="3"/></svg>`, 'С лучами вверх');

// === СЕКЦИЯ 6: Цветные ===
push(`<svg viewBox="0 0 24 24" fill="none" stroke="#1677ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z" fill="#e6f4ff"/><path d="M6 12v5c0 2 3 3.5 6 2 3 1.5 6 0 6-2v-5"/><line x1="12" y1="15" x2="12" y2="18"/></svg>`, 'Синяя');
push(`<svg viewBox="0 0 24 24" fill="none" stroke="#52c41a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z" fill="#f6ffed"/><path d="M6 12v5c0 2 3 3.5 6 2 3 1.5 6 0 6-2v-5"/><line x1="12" y1="15" x2="12" y2="18"/></svg>`, 'Зелёная');
push(`<svg viewBox="0 0 24 24" fill="none" stroke="#d48806" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z" fill="#fffbe6"/><path d="M6 12v5c0 2 3 3.5 6 2 3 1.5 6 0 6-2v-5"/><line x1="12" y1="15" x2="12" y2="18"/></svg>`, 'Золотая');
push(`<svg viewBox="0 0 24 24" fill="none" stroke="#722ed1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z" fill="#f9f0ff"/><path d="M6 12v5c0 2 3 3.5 6 2 3 1.5 6 0 6-2v-5"/><line x1="12" y1="15" x2="12" y2="18"/></svg>`, 'Фиолетовая');
push(`<svg viewBox="0 0 24 24" fill="none" stroke="#eb2f96" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z" fill="#fff0f6"/><path d="M6 12v5c0 2 3 3.5 6 2 3 1.5 6 0 6-2v-5"/><line x1="12" y1="15" x2="12" y2="18"/></svg>`, 'Розовая');
push(`<svg viewBox="0 0 24 24" fill="none" stroke="#08979c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z" fill="#e6fffb"/><path d="M6 12v5c0 2 3 3.5 6 2 3 1.5 6 0 6-2v-5"/><line x1="12" y1="15" x2="12" y2="18"/></svg>`, 'Бирюзовая');
push(`<svg viewBox="0 0 24 24" fill="none" stroke="#f5222d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z" fill="#fff1f0"/><path d="M6 12v5c0 2 3 3.5 6 2 3 1.5 6 0 6-2v-5"/><line x1="12" y1="15" x2="12" y2="18"/></svg>`, 'Красная');
push(`<svg viewBox="0 0 24 24" fill="none" stroke="#8c8c8c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z" fill="#f5f5f5"/><path d="M6 12v5c0 2 3 3.5 6 2 3 1.5 6 0 6-2v-5"/><line x1="12" y1="15" x2="12" y2="18"/></svg>`, 'Серая');

// === СЕКЦИЯ 7: Композиции ===
push(`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 2 3 3.5 6 2 3 1.5 6 0 6-2v-5"/><line x1="12" y1="15" x2="12" y2="18"/><path d="M16 4h6v6" stroke-dasharray="2 1.5"/></svg>`, 'С уголком (ссылка)');
push(`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 2 3 3.5 6 2 3 1.5 6 0 6-2v-5"/></svg>`, 'В круге');
push(`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16M4 12h16"/><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 2 3 3.5 6 2 3 1.5 6 0 6-2v-5"/></svg>`, 'На кресте');
push(`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 2 3 3.5 6 2 3 1.5 6 0 6-2v-5"/><line x1="12" y1="15" x2="12" y2="18"/><path d="M6 10l-4 1M18 10l4 1" opacity="0.3"/></svg>`, 'Тени от верха');
push(`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 2 3 3.5 6 2 3 1.5 6 0 6-2v-5"/><line x1="12" y1="15" x2="12" y2="18"/><path d="M12 5v-2" opacity="0.5"/></svg>`, 'Упрощённый');

const grid = document.getElementById('grid');
variants.forEach(v => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<span class="n">${v.id}</span><div class="btn">${v.svg}</div><span class="name">${v.name}</span>`;
  grid.appendChild(card);
});
</script>
</body>
</html>

  const uniqueId = 'g' + v.id;
  const svgWithId = v.svg.replace(/id="g(\d+)"/g, (m, n) => `id="${uniqueId}${n}"`).replace(/url\(#g(\d+)\)/g, (m, n) => `url(#${uniqueId}${n})`);

  grid.appendChild(card);
});

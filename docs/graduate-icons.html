<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Шляпа выпускника — 50+ вариантов</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #fff; padding: 40px 48px; color: rgba(0,0,0,0.85); }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; max-width: 1200px; }
  .card { display: flex; align-items: center; padding: 10px 12px; gap: 12px; border-radius: 8px; }
  .card:hover { background: #fafafa; }
  .btn {
    width: 24px; height: 24px; border-radius: 50%; border: 1px solid #d9d9d9; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #595959;
  }
  .n { font-size: 11px; color: #bbb; min-width: 20px; }
  .name { font-size: 13px; font-weight: 500; color: rgba(0,0,0,0.85); }
  svg { width: 14px; height: 14px; }
</style>
</head>
<body>

<h1>Шляпа выпускника — 58 вариантов</h1>

<div class="grid" id="grid"></div>

<script>
const cap = (sw)=>({w:22,h:10,x:1,y:4,rx:1});
const head = (sw)=>({w:4,h:6,x:10,y:10,rx:1});

// SVG builder helpers
function mkSvg(parts, sw=2) {
  const els = parts.map(p => {
    if (p.type === 'rect') return `<rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="${p.rx||0}" ${p.fill ? `fill="${p.fill}"` : ''}/>`;
    if (p.type === 'line') return `<line x1="${p.x1}" y1="${p.y1}" x2="${p.x2}" y2="${p.y2}"/>`;
    if (p.type === 'poly') return `<polygon points="${p.pts}" ${p.fill ? `fill="${p.fill}"` : ''}/>`;
    if (p.type === 'path') return `<path d="${p.d}" ${p.fill ? `fill="${p.fill}"` : ''}/>`;
    if (p.type === 'circle') return `<circle cx="${p.cx}" cy="${p.cy}" r="${p.r}" ${p.fill ? `fill="${p.fill}"` : ''}/>`;
    if (p.type === 'ellipse') return `<ellipse cx="${p.cx}" cy="${p.cy}" rx="${p.rx}" ry="${p.ry}"/>`;
    return '';
  }).join('');
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${els}</svg>`;
}

const variants = [];
let id = 0;

// Helpers for tassel, scroll, stars etc
function tasselR(sw) { return [{type:'line',x1:15,y1:10,x2:17,y2:16},{type:'circle',cx:17,cy:17,r:0.6,fill:'currentColor'}]; }
function tasselL(sw) { return [{type:'line',x1:9,y1:10,x2:7,y2:16},{type:'circle',cx:7,cy:17,r:0.6,fill:'currentColor'}]; }
function scroll(sw) { return [{type:'rect',x:7,y:12,w:10,h:4,rx:0.5},{type:'line',x1:9,y1:12,x2:9,y2:16},{type:'line',x1:15,y1:12,x2:15,y2:16}]; }

// === GENERATE ===



// 01-10: Classic variants
for (let sw of [1.5, 2, 2.5]) {
  for (let t of [null, 'tasselR', 'tasselL']) {
    const p = [
      {type:'poly',pts:'12,3 22,9 12,15 2,9'},
      {type:'line',x1:12,y1:15,x2:12,y2:21},
    ];
    if (t === 'tasselR') p.push(...tasselR(sw));
    if (t === 'tasselL') p.push(...tasselL(sw));
    const label = `Классика sw=${sw}` + (t?` + кисточка ${t==='tasselR'?'пр':'лев'}`:'');
    if (variants.length < 10) variants.push({id:++id, svg:mkSvg(p,sw), label});
  }
}

// 11-18: Filled
for (let sw of [2, 1.5]) {
  for (let fill of ['#333','#595959']) {
    const p = [
      {type:'poly',pts:'12,3 22,9 12,15 2,9',fill},
      {type:'line',x1:12,y1:15,x2:12,y2:21},
    ];
    variants.push({id:++id, svg:mkSvg(p,sw), label:`Заливка ${fill} sw=${sw}`});
  }
}

// 19-26: With diploma/scroll
for (let sw of [1.5, 2]) {
  for (let t of ['tasselR', 'tasselL']) {
    const p = [
      {type:'poly',pts:'12,3 22,9 12,15 2,9'},
      {type:'line',x1:12,y1:15,x2:12,y2:21},
      ...scroll(sw),
    ];
    if (t === 'tasselR') p.push(...tasselR(sw));
    if (t === 'tasselL') p.push(...tasselL(sw));
    variants.push({id:++id, svg:mkSvg(p,sw), label:`+свиток sw=${sw} ${t==='tasselR'?'кист пр':'кист лв'}`});
  }
}

// 27-34: Wide/narrow cap
for (let w of [18, 24]) {
  const left = (24-w)/2;
  const right = left+w;
  for (let sw of [1.5, 2]) {
    const p = [
      {type:'poly',pts:`${left},4 ${right},9 12,15 ${left},9`},
      {type:'line',x1:12,y1:15,x2:12,y2:21},
    ];
    variants.push({id:++id, svg:mkSvg(p,sw), label:`${w===18?'Узкая':'Широкая'} sw=${sw}`});
  }
}

// 35-42: Flat top (square academic cap)
for (let sw of [1.5, 2]) {
  for (let filled of [false, true]) {
    const p = [
      {type:'rect',x:7,y:0,w:10,h:1.5,rx:0.5,fill:filled?'currentColor':null},
      {type:'poly',pts:`7,1.5 17,1.5 20,8 12,11 4,8`},
      {type:'line',x1:12,y1:11,x2:12,y2:21},
    ];
    variants.push({id:++id, svg:mkSvg(p,sw), label:`Плоский верх ${filled?'fill':''} sw=${sw}`});
  }
}

// 43-50: Decorative (stars, ribbon, medal)
for (let deco of ['star','ribbon','medal','gradientBar']) {
  for (let sw of [1.5, 2]) {
    const p = [
      {type:'poly',pts:'12,3 22,9 12,15 2,9'},
      {type:'line',x1:12,y1:15,x2:12,y2:21},
    ];
    if (deco === 'star') p.push({type:'poly',pts:'20,7 20.5,5.5 22,5 20.5,4.5 20,3 19.5,4.5 18,5 19.5,5.5',fill:'currentColor'});
    if (deco === 'ribbon') { p.push({type:'rect',x:4,y:2,w:3,h:7,rx:0.3,fill:'currentColor'}); p.push({type:'rect',x:17,y:2,w:3,h:7,rx:0.3,fill:'currentColor'}); }
    if (deco === 'medal') p.push({type:'circle',cx:21,cy:6,r:2,fill:'currentColor'});
    if (deco === 'gradientBar') p.push({type:'rect',x:1,y:8,w:22,h:1.5,rx:0.5,fill:'currentColor'});
    variants.push({id:++id, svg:mkSvg(p,sw), label:`${deco} sw=${sw}`});
  }
}

// 51-58: Offset/asymmetric + broken cap
for (let tilt of ['left','right']) {
  for (let sw of [1.5, 2]) {
    const xoff = tilt === 'left' ? -1 : 1;
    const p = [
      {type:'poly',pts:`${12+xoff},3 ${22+xoff},9 ${12+xoff},15 ${2+xoff},9`},
      {type:'line',x1:12,y1:15,x2:13,y2:21},
    ];
    variants.push({id:++id, svg:mkSvg(p,sw), label:`Наклон ${tilt} sw=${sw}`});
  }
}

const grid = document.getElementById('grid');
variants.forEach(v => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<span class="n">${v.id}</span><div class="btn">${v.svg}</div><span class="name">${v.label}</span>`;
  grid.appendChild(card);
});
</script>
</body>
</html>
